<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API KENNX - Public API Directory</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #E0F2FE; --dark: #1E293B; --primary: #34D399; --accent: #F472B6; --yellow: #FDE047; --white: #FFFFFF; --shadow: 4px 4px 0px var(--dark);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Space Grotesk', sans-serif; background-color: var(--bg); background-image: linear-gradient(var(--dark) 1px, transparent 1px), linear-gradient(90deg, var(--dark) 1px, transparent 1px); background-size: 40px 40px; color: var(--dark); min-height: 100vh; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); opacity: 0.85; z-index: -1; }
        .brutal-box { border: 3px solid var(--dark); box-shadow: var(--shadow); border-radius: 12px; background-color: var(--white); }
        
        /* HEADER */
        header { background-color: var(--primary); border-bottom: 3px solid var(--dark); padding: 16px; position: sticky; top: 0; z-index: 10; }
        .header-inner { max-width: 900px; margin: 0 auto; background-color: var(--white); border: 3px solid var(--dark); border-radius: 50px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 3px 3px 0px var(--dark); }
        .logo { font-weight: 700; font-size: 1.2rem; }
        .status-badge { background: var(--yellow); border: 2px solid var(--dark); padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; display: flex; align-items: center; gap: 6px;}
        .status-dot { width: 10px; height: 10px; background: #059669; border-radius: 50%; border: 2px solid var(--dark); }

        /* MAIN */
        main { max-width: 900px; margin: 30px auto; padding: 0 16px; }
        .hero h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 8px; }
        .hero p { font-size: 1.1rem; color: #475569; margin-bottom: 24px; font-weight: 500; }

        .search-container { position: relative; margin-bottom: 24px; }
        .search-container input { width: 100%; padding: 16px; border: 3px solid var(--dark); border-radius: 12px; box-shadow: var(--shadow); font-family: inherit; font-weight: 700; font-size: 1rem; outline: none; }
        .search-container input:focus { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--dark); }

        .tabs { display: flex; gap: 12px; overflow-x: auto; margin-bottom: 24px; padding-bottom: 8px; }
        .tab { padding: 8px 20px; border: 3px solid var(--dark); border-radius: 30px; font-weight: 700; background: var(--white); cursor: pointer; white-space: nowrap; box-shadow: 3px 3px 0px var(--dark); transition: all 0.1s; }
        .tab.active { background: var(--accent); color: var(--white); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { padding: 20px; display: flex; flex-direction: column; gap: 12px; transition: all 0.2s; }
        .card:hover { transform: translateY(-4px); box-shadow: 6px 6px 0px var(--dark); }
        
        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .method { padding: 4px 10px; border-radius: 6px; border: 2px solid var(--dark); font-weight: 700; font-size: 0.8rem; }
        .method.GET { background: var(--primary); }
        .method.POST { background: var(--yellow); }
        
        .category { font-size: 0.8rem; font-weight: 700; color: #64748B; }
        .card h3 { font-size: 1.3rem; }
        .path { font-family: 'Fira Code', monospace; font-size: 0.85rem; background: #F1F5F9; padding: 4px 8px; border-radius: 4px; border: 1px solid #CBD5E1; word-break: break-all; }
        .card p { font-size: 0.95rem; color: #475569; flex-grow: 1; line-height: 1.4; }
        
        .btn-open { width: 100%; padding: 12px; border: 3px solid var(--dark); border-radius: 8px; background: var(--accent); color: var(--white); font-weight: 700; font-size: 1rem; box-shadow: 3px 3px 0px var(--dark); cursor: pointer; transition: all 0.1s; margin-top: auto; }
        .btn-open:active { transform: translate(3px, 3px); box-shadow: none; }

        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(30, 41, 59, 0.7); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
        .modal-overlay.active { display: flex; }
        .modal-content { width: 100%; max-width: 500px; background: var(--white); border: 3px solid var(--dark); box-shadow: 8px 8px 0px var(--dark); border-radius: 12px; overflow: hidden; animation: popIn 0.2s ease-out; max-height: 90vh; display: flex; flex-direction: column; }
        @keyframes popIn { from { transform: scale(0.9); } to { transform: scale(1); } }

        .modal-header { padding: 16px; background: var(--yellow); border-bottom: 3px solid var(--dark); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { font-size: 1.2rem; }
        .btn-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; font-weight: bold; }
        
        .modal-body { padding: 20px; overflow-y: auto; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px; border: 3px solid var(--dark); border-radius: 8px; font-family: inherit; font-weight: 500; outline: none; }
        .form-group input:focus { box-shadow: 3px 3px 0px var(--dark); }

        .btn-execute { width: 100%; padding: 14px; border: 3px solid var(--dark); border-radius: 8px; background: var(--primary); font-weight: 700; font-size: 1rem; box-shadow: 3px 3px 0px var(--dark); cursor: pointer; }
        .btn-execute:active { transform: translate(3px, 3px); box-shadow: none; }
        .btn-execute:disabled { background: #94A3B8; }

        /* RESULT */
        #result-area { margin-top: 20px; display: none; border-top: 3px dashed #CBD5E1; padding-top: 20px; }
        .res-loader { font-weight: 700; text-align: center; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }
        .res-error { background: #FECACA; color: #991B1B; padding: 12px; border: 3px solid #991B1B; border-radius: 8px; font-weight: 700; }
        
        .res-success img { width: 100%; border: 3px solid var(--dark); border-radius: 8px; margin-bottom: 12px; max-height: 250px; object-fit: cover; }
        .res-success video { width: 100%; border: 3px solid var(--dark); border-radius: 8px; margin-bottom: 12px; background: #000; max-height: 250px;}
        .res-success h4 { margin-bottom: 8px; font-size: 1.1rem; }
        .res-success p { font-size: 0.9rem; color: #475569; margin-bottom: 12px; }
        .btn-dl { display: block; text-align: center; text-decoration: none; background: var(--yellow); color: var(--dark); padding: 10px; border: 3px solid var(--dark); border-radius: 8px; font-weight: 700; box-shadow: 3px 3px 0 var(--dark); margin-top: 8px; }
        
        .code-block { background: #1E293B; color: #34D399; padding: 12px; border-radius: 8px; font-family: 'Fira Code', monospace; font-size: 0.85rem; overflow-x: auto; margin-top: 12px; border: 3px solid var(--dark); white-space: pre-wrap; word-wrap: break-word;}
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="logo">API KENNX ⚡</div>
            <div class="status-badge"><div class="status-dot"></div> Public API</div>
        </div>
    </header>

    <main>
        <div class="hero">
            <h1>Kumpulan API Publik</h1>
            <p>Dokumentasi & Testing API gratis. Bebas dipakai untuk project kamu.</p>
        </div>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="Cari API (contoh: anime, meme)..." oninput="filterData()">
        </div>

        <div class="tabs" id="tabs-container"></div>
        <div class="grid" id="api-grid"></div>
    </main>

    <!-- MODAL PLAYGROUND -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">API Name</h2>
                <button class="btn-close" id="btn-close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="doc-info" style="margin-bottom: 16px;"></div>
                
                <form id="api-form">
                    <div id="form-inputs"></div>
                    <button type="submit" class="btn-execute" id="btn-run">Test Endpoint 🚀</button>
                </form>

                <div id="result-area"></div>
            </div>
        </div>
    </div>

    <script>
        let allTools = [];
        let currentCategory = 'Semua';
        let searchQuery = '';
        let activeTool = null; // Menyimpan data tool yang sedang dibuka

        async function loadTools() {
            try {
                const res = await fetch('/api/list');
                const json = await res.json();
                allTools = json.data;
                renderTabs();
                filterData();
            } catch (err) {
                alert('Gagal memuat daftar API.');
            }
        }

        function renderTabs() {
            const categories = ['Semua', ...new Set(allTools.map(t => t.category))];
            document.getElementById('tabs-container').innerHTML = categories.map(cat => `
                <div class="tab ${cat === currentCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</div>
            `).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderTabs();
            filterData();
        }

        function filterData() {
            searchQuery = document.getElementById('search-input').value.toLowerCase();
            const grid = document.getElementById('api-grid');
            
            const filtered = allTools.filter(tool => {
                const matchCat = currentCategory === 'Semua' || tool.category === currentCategory;
                const matchSearch = tool.name.toLowerCase().includes(searchQuery) || tool.path.toLowerCase().includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; font-weight:700; text-align:center; padding: 20px;">API tidak ditemukan 🔍</p>`;
                return;
            }

            grid.innerHTML = filtered.map(tool => `
                <div class="card brutal-box">
                    <div class="card-top">
                        <span class="method ${tool.method}">${tool.method}</span>
                        <span class="category">${tool.category}</span>
                    </div>
                    <h3>${tool.name}</h3>
                    <div class="path">${tool.path}</div>
                    <p>${tool.desc}</p>
                    <button class="btn-open" onclick="openModal('${tool.id}')">Lihat & Test</button>
                </div>
            `).join('');
        }

        function openModal(id) {
            activeTool = allTools.find(t => t.id === id);
            document.getElementById('modal-title').textContent = activeTool.name;
            
            const baseUrl = window.location.origin;
            document.getElementById('doc-info').innerHTML = `
                <p style="font-weight:700; font-size:0.9rem; margin-bottom:4px;">Endpoint URL:</p>
                <div class="code-block" style="color:var(--yellow);">${activeTool.method} ${baseUrl}${activeTool.path}</div>
            `;

            const inputsContainer = document.getElementById('form-inputs');
            if (activeTool.params.length === 0) {
                inputsContainer.innerHTML = `<p style="font-size: 0.9rem; font-weight: 700; color: #64748B; margin-bottom: 16px;">API ini tidak membutuhkan parameter.</p>`;
            } else {
                inputsContainer.innerHTML = activeTool.params.map(p => `
                    <div class="form-group">
                        <label>${p.label}</label>
                        <input type="text" id="param-${p.key}" placeholder="${p.placeholder}" required>
                    </div>
                `).join('');
            }

            document.getElementById('result-area').style.display = 'none';
            document.getElementById('result-area').innerHTML = '';
            document.getElementById('btn-run').disabled = false;
            document.getElementById('btn-run').textContent = 'Test Endpoint 🚀';

            document.getElementById('modal').classList.add('active');
        }

        document.getElementById('btn-close').onclick = () => document.getElementById('modal').classList.remove('active');
        window.onclick = (e) => { if (e.target === document.getElementById('modal')) document.getElementById('modal').classList.remove('active'); };

        document.getElementById('api-form').onsubmit = async (e) => {
            e.preventDefault();
            
            const btnRun = document.getElementById('btn-run');
            const resultArea = document.getElementById('result-area');
            
            btnRun.disabled = true;
            btnRun.textContent = 'Memproses...';
            resultArea.style.display = 'block';
            resultArea.innerHTML = '<div class="res-loader">⏳ Requesting API...</div>';

            try {
                let url = activeTool.path;
                let options = { method: activeTool.method, headers: {} };
                let queryParams = new URLSearchParams();

                activeTool.params.forEach(p => {
                    const val = document.getElementById(`param-${p.key}`).value;
                    if (activeTool.method === 'GET') queryParams.append(p.key, val);
                    if (activeTool.method === 'POST') options.body = JSON.stringify({ ...JSON.parse(options.body || '{}'), [p.key]: val });
                });

                if (activeTool.method === 'GET' && queryParams.toString()) url += `?${queryParams.toString()}`;
                if (activeTool.method === 'POST') options.headers['Content-Type'] = 'application/json';

                const response = await fetch(url, options);
                const resData = await response.json();

                if (!resData.success) throw new Error(resData.error || 'API Error');

                const d = resData.data;
                let htmlResult = '';

                if (activeTool.id === 'tiktok-dl') {
                    htmlResult = `
                        <div class="res-success">
                            <video src="${d.video}" controls poster="${d.thumbnail}"></video>
                            <h4>${d.title}</h4>
                            <p>Author: @${d.author}</p>
                            <a href="${d.video}" target="_blank" class="btn-dl">⬇️ Download Video (No WM)</a>
                            ${d.audio ? `<a href="${d.audio}" target="_blank" class="btn-dl" style="background:var(--accent); color:white; margin-top:8px;">🎵 Download Audio</a>` : ''}
                        </div>
                    `;
                } else if (activeTool.id === 'anime-random') {
                    htmlResult = `
                        <div class="res-success">
                            <img src="${d.image}" alt="Anime">
                            <h4>${d.title} (${d.type})</h4>
                            <p>⭐ ${d.score} | 📺 ${d.episodes} Eps</p>
                        </div>
                    `;
                } else if (activeTool.id === 'meme-random') {
                    htmlResult = `
                        <div class="res-success">
                            <img src="${d.image}" alt="Meme">
                            <h4>${d.title}</h4>
                        </div>
                    `;
                } else if (activeTool.id === 'qr-generate') {
                    htmlResult = `
                        <div class="res-success">
                            <img src="${d.image}" alt="QR">
                        </div>
                    `;
                } else if (activeTool.id === 'quote-random') {
                    htmlResult = `
                        <div class="res-success">
                            <p style="font-size: 1.1rem; font-style: italic; font-weight:700; margin-bottom:12px;">"${d.quote}"</p>
                            <p style="text-align:right;">- ${d.author}</p>
                        </div>
                    `;
                } else {
                    htmlResult = `<div class="code-block">${JSON.stringify(d, null, 2)}</div>`;
                }

                resultArea.innerHTML = htmlResult;

            } catch (error) {
                resultArea.innerHTML = `<div class="res-error">❌ Error: ${error.message}</div>`;
            } finally {
                btnRun.disabled = false;
                btnRun.textContent = 'Test Lagi 🔄';
            }
        };

        loadTools();
    </script>

</html>
